<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilização da barra de rolagem para ficar mais elegante */
        .scroll-personalizado::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .scroll-personalizado::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 8px;
        }
        .scroll-personalizado::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        .scroll-personalizado::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Evita que inputs de número fiquem com aquelas setinhas feias no canto */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Cabeçalho Principal -->
    <header class="bg-slate-900 text-white shadow-lg py-4 px-6 z-30 relative">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg shadow-inner">
                    <i class="fas fa-box-open text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">Estoque <span class="text-blue-400">Deck</span></h1>
            </div>
            <span class="text-xs font-semibold bg-slate-800 border border-slate-700 py-1 px-3 rounded-full flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <!-- Área de Conteúdo (Agora o scroll principal fica aqui caso a tela seja muito pequena) -->
    <main class="flex-1 overflow-y-auto p-6 scroll-personalizado">
        <div class="max-w-7xl mx-auto grid grid-cols-1 xl:grid-cols-3 gap-8">
            
            <!-- Formulário de Entrada/Edição -->
            <section class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit xl:sticky xl:top-0 z-10">
                <h2 id="tituloFormulario" class="text-xl font-bold mb-5 text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fas fa-plus-circle text-blue-600"></i> Novo Produto
                </h2>
                
                <form id="formEstoque" class="space-y-4">
                    <input type="hidden" id="idEdicao" value="">

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Data da Nota</label>
                        <input type="date" id="dataNota" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nome do Produto</label>
                        <input type="text" id="nomeProduto" placeholder="Ex: Picanha Fatiada" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Marca ou Lote</label>
                        <input type="text" id="marcaLote" placeholder="Ex: Friboi / Lote 123" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Data de Validade</label>
                        <input type="date" id="validade" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Qtd (Kg/Un)</label>
                            <input type="number" id="quantidade" step="0.01" min="0" placeholder="0.00" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Valor (Kg/Un)</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 font-medium">R$</span>
                                <input type="number" id="valorKg" step="0.01" min="0" placeholder="0.00" required class="w-full pl-10 rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-sm transition-colors bg-slate-50 focus:bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col space-y-3 pt-4 border-t border-slate-100">
                        <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 hover:shadow-lg transition-all duration-300 flex justify-center items-center gap-2">
                            <i class="fas fa-spinner fa-spin hidden" id="loadingBtn"></i>
                            <i class="fas fa-check" id="iconBtn"></i> <span id="textoBtn">Adicionar ao Estoque</span>
                        </button>
                        <button type="button" id="btnCancelar" onclick="cancelarEdicao()" class="hidden w-full bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-lg hover:bg-slate-300 transition-all duration-300">
                            Cancelar Edição
                        </button>
                    </div>
                </form>
            </section>

            <!-- Painel da Tabela de Estoque -->
            <section class="xl:col-span-2 bg-white rounded-xl shadow-md border border-slate-200 flex flex-col overflow-hidden h-[75vh]">
                
                <div class="p-5 border-b border-slate-200 bg-white z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-clipboard-list text-blue-600"></i> Itens Cadastrados
                    </h2>
                    <div class="flex items-center gap-2 text-xs font-medium text-slate-600 bg-yellow-50 border border-yellow-200 px-3 py-1.5 rounded-full">
                        <i class="fas fa-exclamation-circle text-yellow-500"></i> Alerta aos 20 dias
                    </div>
                </div>
                
                <!-- Container da Tabela com Scroll Independente -->
                <div class="flex-1 overflow-y-auto overflow-x-auto scroll-personalizado relative bg-slate-50/50">
                    
                    <!-- Overlay de loading -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-white/90 flex justify-center items-center z-30 backdrop-blur-sm">
                        <div class="text-blue-600 flex flex-col items-center">
                            <i class="fas fa-circle-notch fa-spin text-4xl mb-3"></i>
                            <span class="font-semibold text-slate-700">Sincronizando com Estoque Deck...</span>
                        </div>
                    </div>

                    <table class="min-w-full divide-y divide-slate-200">
                        <!-- Cabeçalho da Tabela Fixo (Sticky) -->
                        <thead class="bg-white sticky top-0 z-20 shadow-sm ring-1 ring-black ring-opacity-5">
                            <tr>
                                <th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Produto / Detalhes</th>
                                <th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Estoque</th>
                                <th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Status de Validade</th>
                                <th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Financeiro</th>
                                <th class="px-5 py-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaEstoque" class="bg-white divide-y divide-slate-100">
                            <!-- JS insere aqui -->
                        </tbody>
                    </table>
                    
                    <!-- Estado Vazio -->
                    <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-400">
                        <i class="fas fa-box-open text-6xl mb-4 text-slate-200"></i>
                        <p class="text-lg font-medium text-slate-500">Nenhum produto cadastrado.</p>
                        <p class="text-sm">Os produtos aparecerão aqui.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const FIREBASE_URL = "https://estoquedeck-default-rtdb.firebaseio.com/estoque";

        const produtosIniciais = [
            "Picanha", "Picanha fatiada", "Alcatra", "Noix", "Paleta Bovina", "Filé Mignon",
            "Carneiro Carré", "Carneiro Pernil", "Carneiro Paleta",
            "Peixe Filhote", "Espeto Filhote pré assado", "Peixe Salmao", "Peixe Abadejo", "Peixe File de Merluza", "Peixe Tilapia", "Camarão",
            "Peito de Frango", "Frango à Passarinho",
            "Torresmo", "Lombo suíno", "Bisteca suina", "Pé porco", "Rabo porco", "Calabresa", "Paio", "Costelinha de porco",
            "Tempero arroz", "Tempero sal", "Cabloquinha"
        ];

        let estoque = [];

        function formatarData(dataStr) {
            if (!dataStr) return '--/--/----';
            const [ano, mes, dia] = dataStr.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function formatarMoeda(valor) {
            return parseFloat(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularStatusValidade(dataValidadeStr) {
            if (!dataValidadeStr) return { classe: 'bg-slate-100 text-slate-600', icone: 'fa-minus', texto: 'Sem data' };
            const [ano, mes, dia] = dataValidadeStr.split('-');
            const dataValidade = new Date(ano, mes - 1, dia);
            dataValidade.setHours(0,0,0,0);
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const diffTempo = dataValidade - hoje;
            const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));

            if (diffDias < 0) return { classe: 'bg-red-100 text-red-700 border-red-200', icone: 'fa-times-circle', texto: 'Vencido' };
            if (diffDias <= 20) return { classe: 'bg-yellow-100 text-yellow-700 border-yellow-300', icone: 'fa-exclamation-triangle', texto: `Vence em ${diffDias} dias` };
            return { classe: 'bg-green-100 text-green-700 border-green-200', icone: 'fa-check-circle', texto: 'No prazo' };
        }

        async function carregarEstoque() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                const response = await fetch(`${FIREBASE_URL}.json`);
                const data = await response.json();
                estoque = [];

                if (data === null) {
                    await inicializarBancoDeDados();
                } else {
                    Object.keys(data).forEach(key => {
                        estoque.push({ id: key, ...data[key] });
                    });
                    atualizarTabela();
                }
            } catch (error) {
                console.error("Erro ao carregar dados: ", error);
                alert("Erro ao conectar. Verifique sua internet ou as regras do Firebase.");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        async function inicializarBancoDeDados() {
            const hoje = new Date().toISOString().split('T')[0];
            const dataValidadeGen = new Date();
            dataValidadeGen.setDate(dataValidadeGen.getDate() + 30);
            const validadeFormatada = dataValidadeGen.toISOString().split('T')[0];

            let objetoInicial = {};

            produtosIniciais.forEach((nome, index) => {
                const idUnico = "item_deck_" + index;
                objetoInicial[idUnico] = {
                    dataNota: hoje,
                    nomeProduto: nome,
                    marcaLote: "A definir",
                    validade: validadeFormatada,
                    quantidade: 0,
                    valorKg: 0
                };
            });

            await fetch(`${FIREBASE_URL}.json`, {
                method: 'PUT',
                body: JSON.stringify(objetoInicial),
                headers: { 'Content-Type': 'application/json' }
            });
            await carregarEstoque();
        }

        function atualizarTabela() {
            const tbody = document.getElementById('tabelaEstoque');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (estoque.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                estoque.sort((a, b) => {
                    if (a.quantidade === 0 && b.quantidade !== 0) return -1;
                    if (a.quantidade !== 0 && b.quantidade === 0) return 1;
                    return new Date(a.validade) - new Date(b.validade);
                });

                estoque.forEach((item) => {
                    const status = calcularStatusValidade(item.validade);
                    const isVazio = item.quantidade == 0;
                    
                    const tr = document.createElement('tr');
                    tr.className = `hover:bg-slate-50 transition-colors group 
                        ${status.classe.includes('yellow') && !isVazio ? 'bg-yellow-50/40' : ''} 
                        ${status.classe.includes('red') && !isVazio ? 'bg-red-50/40' : ''}`;

                    tr.innerHTML = `
                        <td class="px-5 py-4 whitespace-nowrap">
                            <div class="font-bold text-slate-800 text-sm">${item.nomeProduto}</div>
                            <div class="text-xs mt-1 ${item.marcaLote === 'A definir' ? 'text-orange-500 font-semibold' : 'text-slate-500'}">
                                <i class="fas fa-tag mr-1 opacity-70"></i>${item.marcaLote}
                            </div>
                        </td>
                        <td class="px-5 py-4 whitespace-nowrap">
                            <div class="flex items-baseline gap-1">
                                <span class="text-lg font-black ${isVazio ? 'text-red-500' : 'text-slate-700'}">${item.quantidade}</span>
                                <span class="text-xs font-medium text-slate-500 uppercase">Kg/Un</span>
                            </div>
                        </td>
                        <td class="px-5 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-slate-700 mb-1.5"><i class="far fa-calendar-alt text-slate-400 mr-1.5"></i>${formatarData(item.validade)}</div>
                            ${!isVazio ? 
                            `<span class="px-2.5 py-1 inline-flex text-[11px] font-bold rounded-md border ${status.classe} shadow-sm">
                                <i class="fas ${status.icone} mr-1.5 mt-0.5"></i> ${status.texto}
                            </span>` : 
                            `<span class="px-2.5 py-1 inline-flex text-[11px] font-bold rounded-md border bg-slate-100 text-slate-500 border-slate-200">
                                Aguardando uso
                            </span>`}
                        </td>
                        <td class="px-5 py-4 whitespace-nowrap">
                            <div class="text-xs text-slate-500 mb-1"><span class="font-semibold">Nota:</span> ${formatarData(item.dataNota)}</div>
                            <div class="text-sm font-bold text-emerald-600">${formatarMoeda(item.valorKg)} <span class="text-[10px] text-slate-400 uppercase font-medium">/ Kg</span></div>
                        </td>
                        <td class="px-5 py-4 whitespace-nowrap text-center">
                            <div class="flex justify-center gap-2 opacity-100 sm:opacity-40 sm:group-hover:opacity-100 transition-opacity">
                                <button onclick="prepararEdicao('${item.id}')" class="bg-blue-50 text-blue-600 p-2 rounded-lg hover:bg-blue-600 hover:text-white transition-colors border border-blue-100" title="Editar produto">
                                    <i class="fas fa-pen text-sm"></i>
                                </button>
                                <button onclick="removerItem('${item.id}')" class="bg-red-50 text-red-500 p-2 rounded-lg hover:bg-red-500 hover:text-white transition-colors border border-red-100" title="Excluir produto">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        document.getElementById('formEstoque').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnIcon = document.getElementById('iconBtn');
            const btnLoading = document.getElementById('loadingBtn');
            const textoBtn = document.getElementById('textoBtn');
            const textoOriginal = textoBtn.innerText;
            
            btnIcon.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            textoBtn.innerText = "Salvando...";

            const idEdicao = document.getElementById('idEdicao').value;
            const itemDados = {
                dataNota: document.getElementById('dataNota').value,
                nomeProduto: document.getElementById('nomeProduto').value,
                marcaLote: document.getElementById('marcaLote').value,
                validade: document.getElementById('validade').value,
                quantidade: parseFloat(document.getElementById('quantidade').value),
                valorKg: parseFloat(document.getElementById('valorKg').value)
            };

            try {
                if (idEdicao === "") {
                    await fetch(`${FIREBASE_URL}.json`, {
                        method: 'POST',
                        body: JSON.stringify(itemDados),
                        headers: { 'Content-Type': 'application/json' }
                    });
                } else {
                    await fetch(`${FIREBASE_URL}/${idEdicao}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify(itemDados),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    cancelarEdicao();
                }
                this.reset();
                await carregarEstoque();
            } catch (error) {
                console.error("Erro ao salvar: ", error);
                alert("Erro ao salvar o produto no Deck.");
            } finally {
                btnLoading.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                textoBtn.innerText = textoOriginal;
            }
        });

        function prepararEdicao(id) {
            const item = estoque.find(i => i.id === id);
            if(!item) return;
            
            document.getElementById('idEdicao').value = item.id;
            document.getElementById('dataNota').value = item.dataNota;
            document.getElementById('nomeProduto').value = item.nomeProduto;
            document.getElementById('marcaLote').value = item.marcaLote === 'A definir' ? '' : item.marcaLote;
            document.getElementById('validade').value = item.validade;
            document.getElementById('quantidade').value = item.quantidade;
            document.getElementById('valorKg').value = item.valorKg;

            document.getElementById('tituloFormulario').innerHTML = '<i class="fas fa-pen-square text-emerald-600"></i> Editando Produto';
            document.getElementById('textoBtn').innerText = 'Salvar Alterações';
            document.getElementById('iconBtn').className = 'fas fa-save';
            document.getElementById('btnSalvar').className = 'w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-700 hover:shadow-lg transition-all duration-300 flex justify-center items-center gap-2';
            document.getElementById('btnCancelar').classList.remove('hidden');
        }

        function cancelarEdicao() {
            document.getElementById('formEstoque').reset();
            document.getElementById('idEdicao').value = "";
            
            document.getElementById('tituloFormulario').innerHTML = '<i class="fas fa-plus-circle text-blue-600"></i> Novo Produto';
            document.getElementById('textoBtn').innerText = 'Adicionar ao Estoque';
            document.getElementById('iconBtn').className = 'fas fa-check';
            document.getElementById('btnSalvar').className = 'w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 hover:shadow-lg transition-all duration-300 flex justify-center items-center gap-2';
            document.getElementById('btnCancelar').classList.add('hidden');
        }

        async function removerItem(id) {
            if(confirm('Tem certeza que deseja apagar este item permanentemente do Estoque Deck?')) {
                try {
                    await fetch(`${FIREBASE_URL}/${id}.json`, { method: 'DELETE' });
                    
                    if(document.getElementById('idEdicao').value === id) {
                        cancelarEdicao();
                    }
                    await carregarEstoque();
                } catch (error) {
                    console.error("Erro ao deletar: ", error);
                    alert("Erro ao remover o produto.");
                }
            }
        }

        carregarEstoque();
    </script>
</body>
</html>
