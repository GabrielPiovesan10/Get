<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Trava de Zoom e Escala para Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Controle de Estoque Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Trava o comportamento de arrastar a tela pra fora (efeito elástico) */
        body {
            overscroll-behavior-y: none;
            overscroll-behavior-x: none;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
        }

        /* Força fontes de input para 16px no mobile para impedir zoom automático do teclado (especialmente no iOS) */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* Estilização da barra de rolagem */
        .scroll-personalizado::-webkit-scrollbar { width: 6px; }
        .scroll-personalizado::-webkit-scrollbar-track { background: transparent; }
        .scroll-personalizado::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-gray-800 h-[100dvh] flex flex-col overflow-hidden select-none">

    <!-- Cabeçalho Principal Fixo -->
    <header class="bg-slate-900 text-white shadow-md py-3 px-4 sm:px-6 z-30 shrink-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-inner">
                    <i class="fas fa-box-open text-lg"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide">Estoque <span class="text-blue-400">Deck</span></h1>
            </div>
            <span class="text-[10px] sm:text-xs font-semibold bg-slate-800 border border-slate-700 py-1 px-2.5 rounded-full flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <!-- Área de Conteúdo Rolável -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden scroll-personalizado p-4 sm:p-6 pb-20">
        <div class="max-w-7xl mx-auto grid grid-cols-1 xl:grid-cols-3 gap-6">
            
            <!-- Formulário -->
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit xl:sticky xl:top-0 z-10 shrink-0">
                <h2 id="tituloFormulario" class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fas fa-plus-circle text-blue-600"></i> Novo Produto
                </h2>
                
                <form id="formEstoque" class="space-y-4">
                    <input type="hidden" id="idEdicao" value="">

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Data da Nota</label>
                        <input type="date" id="dataNota" required class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nome do Produto</label>
                        <input type="text" id="nomeProduto" placeholder="Ex: Picanha Fatiada" required class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Marca ou Lote</label>
                        <input type="text" id="marcaLote" placeholder="Ex: Friboi / Lote 123" required class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Data de Validade</label>
                        <input type="date" id="validade" required class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Qtd (Kg/Un)</label>
                            <input type="number" id="quantidade" step="0.01" min="0" placeholder="0.00" required class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Valor Unitário</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-bold">R$</span>
                                <input type="number" id="valorKg" step="0.01" min="0" placeholder="0.00" required class="w-full pl-10 rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3 transition-colors bg-slate-50 focus:bg-white outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col space-y-2 pt-2">
                        <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 shadow-sm">
                            <i class="fas fa-spinner fa-spin hidden" id="loadingBtn"></i>
                            <i class="fas fa-check" id="iconBtn"></i> <span id="textoBtn">Salvar no Estoque</span>
                        </button>
                        <button type="button" id="btnCancelar" onclick="cancelarEdicao()" class="hidden w-full bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl hover:bg-slate-300 active:scale-[0.98] transition-all duration-200">
                            Cancelar Edição
                        </button>
                    </div>
                </form>
            </section>

            <!-- Painel de Produtos (Cards) -->
            <section class="xl:col-span-2 relative">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 px-1">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-clipboard-list text-blue-600"></i> Produtos Cadastrados
                    </h2>
                    <div class="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider text-slate-600 bg-yellow-100/80 border border-yellow-200 px-3 py-1.5 rounded-full">
                        <i class="fas fa-exclamation-circle text-yellow-600"></i> Alerta aos 20 dias
                    </div>
                </div>
                
                <!-- Overlay de loading -->
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-100/80 flex justify-center items-start pt-20 z-20 backdrop-blur-sm rounded-2xl hidden">
                    <div class="bg-white px-6 py-4 rounded-2xl shadow-lg border border-slate-200 flex items-center gap-4 text-blue-600">
                        <i class="fas fa-circle-notch fa-spin text-2xl"></i>
                        <span class="font-bold text-slate-700 text-sm uppercase tracking-wider">Sincronizando...</span>
                    </div>
                </div>

                <!-- Grid de Cards (Substitui a Tabela) -->
                <div id="gridEstoque" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Cards inseridos via JS -->
                </div>
                
                <!-- Estado Vazio -->
                <div id="emptyState" class="hidden flex-col items-center justify-center py-20 bg-white rounded-2xl border border-dashed border-slate-300 mt-2 text-slate-400">
                    <i class="fas fa-box-open text-6xl mb-4 text-slate-200"></i>
                    <p class="text-lg font-bold text-slate-600">Estoque vazio.</p>
                    <p class="text-sm font-medium">Os produtos aparecerão aqui.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const FIREBASE_URL = "https://estoquedeck-default-rtdb.firebaseio.com/estoque";

        const produtosIniciais = [
            "Picanha", "Picanha fatiada", "Alcatra", "Noix", "Paleta Bovina", "Filé Mignon",
            "Carneiro Carré", "Carneiro Pernil", "Carneiro Paleta",
            "Peixe Filhote", "Espeto Filhote pré assado", "Peixe Salmao", "Peixe Abadejo", "Peixe File de Merluza", "Peixe Tilapia", "Camarão",
            "Peito de Frango", "Frango à Passarinho",
            "Torresmo", "Lombo suíno", "Bisteca suina", "Pé porco", "Rabo porco", "Calabresa", "Paio", "Costelinha de porco",
            "Tempero arroz", "Tempero sal", "Cabloquinha"
        ];

        let estoque = [];

        function formatarData(dataStr) {
            if (!dataStr) return '--/--/----';
            const [ano, mes, dia] = dataStr.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function formatarMoeda(valor) {
            return parseFloat(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularStatusValidade(dataValidadeStr) {
            if (!dataValidadeStr) return { color: 'slate', icone: 'fa-minus', texto: 'Sem data' };
            const [ano, mes, dia] = dataValidadeStr.split('-');
            const dataValidade = new Date(ano, mes - 1, dia);
            dataValidade.setHours(0,0,0,0);
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const diffTempo = dataValidade - hoje;
            const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));

            if (diffDias < 0) return { color: 'red', icone: 'fa-times-circle', texto: 'Vencido' };
            if (diffDias <= 20) return { color: 'yellow', icone: 'fa-exclamation-triangle', texto: `${diffDias} dias` };
            return { color: 'emerald', icone: 'fa-check-circle', texto: 'No prazo' };
        }

        async function carregarEstoque() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                const response = await fetch(`${FIREBASE_URL}.json`);
                const data = await response.json();
                estoque = [];

                if (data === null) {
                    await inicializarBancoDeDados();
                } else {
                    Object.keys(data).forEach(key => {
                        estoque.push({ id: key, ...data[key] });
                    });
                    atualizarTabela();
                }
            } catch (error) {
                console.error("Erro ao carregar:", error);
                alert("Falha ao conectar. Verifique a internet.");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        async function inicializarBancoDeDados() {
            const hoje = new Date().toISOString().split('T')[0];
            const dataValidadeGen = new Date();
            dataValidadeGen.setDate(dataValidadeGen.getDate() + 30);
            const validadeFormatada = dataValidadeGen.toISOString().split('T')[0];

            let objetoInicial = {};

            produtosIniciais.forEach((nome, index) => {
                const idUnico = "item_deck_" + index;
                objetoInicial[idUnico] = {
                    dataNota: hoje,
                    nomeProduto: nome,
                    marcaLote: "A definir",
                    validade: validadeFormatada,
                    quantidade: 0,
                    valorKg: 0
                };
            });

            await fetch(`${FIREBASE_URL}.json`, {
                method: 'PUT',
                body: JSON.stringify(objetoInicial),
                headers: { 'Content-Type': 'application/json' }
            });
            await carregarEstoque();
        }

        function atualizarTabela() {
            const gridContainer = document.getElementById('gridEstoque');
            const emptyState = document.getElementById('emptyState');
            gridContainer.innerHTML = '';

            if (estoque.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                estoque.sort((a, b) => {
                    if (a.quantidade === 0 && b.quantidade !== 0) return -1;
                    if (a.quantidade !== 0 && b.quantidade === 0) return 1;
                    return new Date(a.validade) - new Date(b.validade);
                });

                estoque.forEach((item) => {
                    const status = calcularStatusValidade(item.validade);
                    const isVazio = item.quantidade == 0;
                    
                    const div = document.createElement('div');
                    
                    // Design do Card responsivo
                    let bordaCor = 'border-slate-200';
                    let bgCard = 'bg-white';
                    
                    if (!isVazio) {
                        if (status.color === 'yellow') { bordaCor = 'border-yellow-300'; bgCard = 'bg-yellow-50/30'; }
                        if (status.color === 'red') { bordaCor = 'border-red-300'; bgCard = 'bg-red-50/30'; }
                    }

                    div.className = `${bgCard} border ${bordaCor} rounded-2xl shadow-sm p-4 flex flex-col gap-4 transition-all duration-200`;

                    div.innerHTML = `
                        <!-- Cabeçalho do Card: Nome e Botões -->
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800 text-lg leading-tight mb-1">${item.nomeProduto}</h3>
                                <div class="text-[11px] font-bold uppercase tracking-wider ${item.marcaLote === 'A definir' ? 'text-orange-500' : 'text-slate-500'}">
                                    <i class="fas fa-tag mr-1 opacity-70"></i>${item.marcaLote}
                                </div>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="prepararEdicao('${item.id}')" class="w-9 h-9 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-600 hover:text-white transition-colors active:scale-90" title="Editar">
                                    <i class="fas fa-pen text-sm"></i>
                                </button>
                                <button onclick="removerItem('${item.id}')" class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-colors active:scale-90" title="Apagar">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Miolo do Card: Info Principal -->
                        <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-0.5">Em Estoque</p>
                                <p class="text-xl font-black ${isVazio ? 'text-red-500' : 'text-slate-700'} leading-none">${item.quantidade} <span class="text-[11px] font-bold text-slate-400 uppercase">Kg/Un</span></p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-0.5">Custo</p>
                                <p class="text-base font-bold text-emerald-600 leading-none">${formatarMoeda(item.valorKg)}</p>
                            </div>
                        </div>

                        <!-- Rodapé do Card: Validade e Nota -->
                        <div class="flex justify-between items-end mt-auto">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Nota: ${formatarData(item.dataNota)}</p>
                                <p class="text-sm font-bold text-slate-700 flex items-center gap-1.5"><i class="far fa-calendar-alt text-slate-400"></i> ${formatarData(item.validade)}</p>
                            </div>
                            
                            ${!isVazio ? 
                            `<span class="px-2.5 py-1.5 inline-flex text-[11px] font-bold uppercase tracking-wider rounded-lg bg-${status.color}-100 text-${status.color}-700 border border-${status.color}-200">
                                <i class="fas ${status.icone} mr-1.5 mt-[1px]"></i> ${status.texto}
                            </span>` : 
                            `<span class="px-2.5 py-1.5 inline-flex text-[11px] font-bold uppercase tracking-wider rounded-lg bg-slate-100 text-slate-500 border border-slate-200">
                                Aguardando
                            </span>`}
                        </div>
                    `;
                    gridContainer.appendChild(div);
                });
            }
        }

        document.getElementById('formEstoque').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnIcon = document.getElementById('iconBtn');
            const btnLoading = document.getElementById('loadingBtn');
            const textoBtn = document.getElementById('textoBtn');
            const textoOriginal = textoBtn.innerText;
            
            btnIcon.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            textoBtn.innerText = "Processando...";
            
            // Tira o foco do teclado no celular logo após clicar em salvar
            document.activeElement.blur();

            const idEdicao = document.getElementById('idEdicao').value;
            const itemDados = {
                dataNota: document.getElementById('dataNota').value,
                nomeProduto: document.getElementById('nomeProduto').value,
                marcaLote: document.getElementById('marcaLote').value,
                validade: document.getElementById('validade').value,
                quantidade: parseFloat(document.getElementById('quantidade').value),
                valorKg: parseFloat(document.getElementById('valorKg').value)
            };

            try {
                if (idEdicao === "") {
                    await fetch(`${FIREBASE_URL}.json`, {
                        method: 'POST',
                        body: JSON.stringify(itemDados),
                        headers: { 'Content-Type': 'application/json' }
                    });
                } else {
                    await fetch(`${FIREBASE_URL}/${idEdicao}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify(itemDados),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    cancelarEdicao();
                }
                this.reset();
                await carregarEstoque();
                
                // Volta pro topo no celular pra pessoa ver que salvou
                document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao salvar o produto.");
            } finally {
                btnLoading.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                textoBtn.innerText = textoOriginal;
            }
        });

        function prepararEdicao(id) {
            const item = estoque.find(i => i.id === id);
            if(!item) return;
            
            document.getElementById('idEdicao').value = item.id;
            document.getElementById('dataNota').value = item.dataNota;
            document.getElementById('nomeProduto').value = item.nomeProduto;
            document.getElementById('marcaLote').value = item.marcaLote === 'A definir' ? '' : item.marcaLote;
            document.getElementById('validade').value = item.validade;
            document.getElementById('quantidade').value = item.quantidade;
            document.getElementById('valorKg').value = item.valorKg;

            document.getElementById('tituloFormulario').innerHTML = '<i class="fas fa-pen-square text-emerald-600"></i> Editando Produto';
            document.getElementById('textoBtn').innerText = 'Salvar Alterações';
            document.getElementById('iconBtn').className = 'fas fa-save';
            document.getElementById('btnSalvar').className = 'w-full bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-emerald-700 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 shadow-sm';
            document.getElementById('btnCancelar').classList.remove('hidden');

            document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById('formEstoque').reset();
            document.getElementById('idEdicao').value = "";
            
            document.getElementById('tituloFormulario').innerHTML = '<i class="fas fa-plus-circle text-blue-600"></i> Novo Produto';
            document.getElementById('textoBtn').innerText = 'Salvar no Estoque';
            document.getElementById('iconBtn').className = 'fas fa-check';
            document.getElementById('btnSalvar').className = 'w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 shadow-sm';
            document.getElementById('btnCancelar').classList.add('hidden');
        }

        async function removerItem(id) {
            if(confirm('Tem certeza que deseja apagar este item permanentemente?')) {
                try {
                    await fetch(`${FIREBASE_URL}/${id}.json`, { method: 'DELETE' });
                    
                    if(document.getElementById('idEdicao').value === id) {
                        cancelarEdicao();
                    }
                    await carregarEstoque();
                } catch (error) {
                    console.error("Erro ao deletar:", error);
                    alert("Erro ao remover o produto.");
                }
            }
        }

        carregarEstoque();
    </script>
</body>
</html>
